version: '3.8'

services:
  # PostgreSQL with pgvector extension enabled
  postgres_vector:
    image: pgvector/pgvector:pg16
    container_name: intellireport_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: intellireport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellireport_backend
    depends_on:
      postgres_vector:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres_vector:5432/intellireport
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres_vector:5432/intellireport
      - DEBUG=true
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
